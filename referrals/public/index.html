<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Referrals API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 540px;
      margin: 80px auto;
      padding: 0 16px;
      color: #1a1a1a;
      line-height: 1.6;
    }
    code { background: #f0f0f0; border-radius: 3px; padding: 1px 5px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>Referrals API</h1>
  <p>
    This service has no UI of its own. The referral finder is a page in the main
    client, so there is only one interface to maintain:
  </p>
  <p><a href="http://localhost:3001/referrals">http://localhost:3001/referrals</a></p>
  <p>
    This port serves the API it calls: <code>/status</code>, <code>/connections</code>,
    <code>/search?company=</code>, <code>/companies</code>.
  </p>
</body>
</html>
