services:
  event-bus:
    build: ./blog/event-bus
    ports:
      - "4005:4005"
    environment:
      - QUERY_URL=http://query:4002
      - MODERATION_URL=http://moderation:4003
    networks:
      - blog-network

  query:
    build: ./blog/query
    ports:
      - "4002:4002"
    volumes:
      - ./blog/query/data:/app/data
    networks:
      - blog-network

  moderation:
    build: ./blog/moderation
    ports:
      - "4003:4003"
    environment:
      - EVENT_BUS_URL=http://event-bus:4005
    depends_on:
      - event-bus
    networks:
      - blog-network

  posts:
    build: ./blog/posts
    ports:
      - "3000:3000"
    environment:
      - EVENT_BUS_URL=http://event-bus:4005
      - AUTH_URL=http://auth:4007
    volumes:
      - ./blog/posts/data:/app/data
    depends_on:
      - event-bus
      - auth
    networks:
      - blog-network

  comments:
    build: ./blog/comments
    ports:
      - "4000:4000"
    environment:
      - EVENT_BUS_URL=http://event-bus:4005
      - AUTH_URL=http://auth:4007
    volumes:
      - ./blog/comments/data:/app/data
    depends_on:
      - event-bus
      - auth
    networks:
      - blog-network

  # Owns user identity - the only service that verifies Google tokens or
  # checks a password, and the only one holding APP_JWT_SECRET. posts and
  # comments call its /auth/verify instead of checking sign-in themselves.
  # APP_JWT_SECRET defaults to empty here on purpose: unset, the service
  # falls back to a random secret for that run (see auth/index.js) rather
  # than docker-compose failing outright - same graceful behavior as `npm
  # run dev`. Set it in a repo-root .env file to keep sessions across restarts.
  auth:
    build: ./auth
    ports:
      - "4007:4007"
    environment:
      - APP_JWT_SECRET=${APP_JWT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./auth/data:/app/data
    networks:
      - blog-network

  # REACT_APP_GOOGLE_CLIENT_ID must equal auth's GOOGLE_CLIENT_ID above - both
  # read from the same repo-root .env. The client Dockerfile runs `npm start`
  # (the CRA dev server), which reads process.env at compile time, so passing
  # it here works the same way a local `blog/client/.env` does for `npm run dev`.
  client:
    build: ./blog/client
    ports:
      - "3001:3001"
    environment:
      - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-}
    depends_on:
      - query
      - posts
      - comments
      - auth
      - referrals
      - tutor
    networks:
      - blog-network

  # Practice's AI coach. Not on the event bus and shares no data with anything
  # else - it only proxies to a model. OLLAMA_URL points at the *host's* Ollama
  # rather than a container: the model is a separate program the user installs
  # and runs themselves, and pulling multi-GB weights into a container image
  # would be far worse than reaching out to the one they already have.
  tutor:
    build: ./tutor
    ports:
      - "4008:4008"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - TUTOR_MODEL=${TUTOR_MODEL:-qwen2.5-coder:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - blog-network

  # Backend for the client's /referrals page. Deliberately not on the event
  # bus - it shares no data with the blog, only the frontend.
  referrals:
    build: ./referrals
    ports:
      - "4006:4006"
    volumes:
      - ./referrals/data:/app/data
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
