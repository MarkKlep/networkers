<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 760" width="1380" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1380" height="760" fill="#FFFFFF"/>

  <text x="620" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Blog microservices — event-driven architecture</text>

  <!-- Arrows (drawn first so boxes sit on top of the lines) -->

  <!-- Client -> Posts (write) -->
  <line x1="580" y1="94" x2="230" y2="178" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="330" y="140" font-size="12.5" fill="#2563EB" text-anchor="middle">POST /posts</text>

  <!-- Client -> Comments (write) -->
  <line x1="660" y1="94" x2="990" y2="178" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="900" y="140" font-size="12.5" fill="#2563EB" text-anchor="middle">POST /posts/:id/comments</text>

  <!-- Posts -> Event Bus: publish PostCreated -->
  <line x1="220" y1="244" x2="570" y2="358" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="300" y="315" font-size="12.5" fill="#B45309" text-anchor="middle">publish</text>
  <text x="300" y="331" font-size="12.5" fill="#B45309" text-anchor="middle">PostCreated</text>

  <!-- Comments -> Event Bus: publish CommentCreated (one-way — comments never receives anything back) -->
  <line x1="1010" y1="244" x2="655" y2="360" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="960" y="315" font-size="12.5" fill="#B45309" text-anchor="middle">publish</text>
  <text x="960" y="331" font-size="12.5" fill="#B45309" text-anchor="middle">CommentCreated</text>

  <!-- Event Bus -> Moderation: forward CommentCreated -->
  <line x1="700" y1="405" x2="790" y2="558" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="655" y="480" font-size="12.5" fill="#B45309" text-anchor="middle">forward</text>
  <text x="655" y="496" font-size="12.5" fill="#B45309" text-anchor="middle">CommentCreated</text>

  <!-- Moderation -> Event Bus: publish CommentModerated -->
  <line x1="890" y1="558" x2="722" y2="410" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="900" y="480" font-size="12.5" fill="#B45309" text-anchor="middle">publish</text>
  <text x="900" y="496" font-size="12.5" fill="#B45309" text-anchor="middle">CommentModerated</text>

  <!-- Event Bus -> Query: routes PostCreated, CommentCreated, and CommentModerated (moderation's verdict lands here) -->
  <line x1="600" y1="424" x2="440" y2="558" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="420" y="480" font-size="12.5" fill="#B45309" text-anchor="middle">route (all 3</text>
  <text x="420" y="496" font-size="12.5" fill="#B45309" text-anchor="middle">event types)</text>

  <!-- Query -> Client (read), routed under the Moderation box, then clear of every box on the right -->
  <path d="M 500,592 L 500,650 L 1220,650 L 1220,62 L 720,62" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1235" y="320" font-size="12.5" fill="#059669" text-anchor="start">GET /posts</text>
  <text x="1235" y="338" font-size="12.5" fill="#059669" text-anchor="start">(with comments</text>
  <text x="1235" y="356" font-size="12.5" fill="#059669" text-anchor="start">+ status)</text>

  <!-- Client box -->
  <rect x="520" y="30" width="200" height="64" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="620" y="56" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4C1D95">Client</text>
  <text x="620" y="76" text-anchor="middle" font-size="12" fill="#5B21B6">React (CRA) · :3001</text>

  <!-- Posts box -->
  <rect x="90" y="180" width="200" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="190" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1E3A8A">Posts</text>
  <text x="190" y="226" text-anchor="middle" font-size="12" fill="#1D4ED8">Express (Node) · :3000</text>

  <!-- Comments box -->
  <rect x="950" y="180" width="200" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1050" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1E3A8A">Comments</text>
  <text x="1050" y="226" text-anchor="middle" font-size="12" fill="#1D4ED8">Express (Node) · :4000</text>

  <!-- Event Bus box -->
  <rect x="520" y="360" width="200" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="386" text-anchor="middle" font-size="14.5" font-weight="600" fill="#78350F">Event Bus</text>
  <text x="620" y="406" text-anchor="middle" font-size="12" fill="#92400E">Express (Node) · :4005</text>

  <!-- Query box -->
  <rect x="300" y="560" width="200" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="586" text-anchor="middle" font-size="14.5" font-weight="600" fill="#065F46">Query</text>
  <text x="400" y="606" text-anchor="middle" font-size="12" fill="#047857">FastAPI (Python) · :4002</text>

  <!-- Moderation box -->
  <rect x="740" y="560" width="200" height="64" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="840" y="586" text-anchor="middle" font-size="14.5" font-weight="600" fill="#831843">Moderation</text>
  <text x="840" y="606" text-anchor="middle" font-size="12" fill="#9D174D">Express (Node) · :4003</text>

  <!-- Legend -->
  <g transform="translate(60, 680)">
    <line x1="0" y1="4" x2="30" y2="4" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="40" y="9" font-size="12.5" fill="#374151">write (client → service)</text>

    <line x1="230" y1="4" x2="260" y2="4" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="270" y="9" font-size="12.5" fill="#374151">read (client ← query)</text>

    <line x1="440" y1="4" x2="470" y2="4" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
    <text x="480" y="9" font-size="12.5" fill="#374151">async event (fire-and-forget, routed by type — not a blind broadcast)</text>
  </g>

  <text x="620" y="725" text-anchor="middle" font-size="12" fill="#6B7280">posts, comments and moderation never call each other directly — they only publish/consume events through the event bus</text>
  <text x="620" y="743" text-anchor="middle" font-size="12" fill="#6B7280">comments only ever stores raw content — query alone tracks status, defaulting to "pending" and updating it once moderation's verdict arrives</text>
</svg>
