<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#FFFFFF"/>

  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Blog microservices — event-driven architecture</text>

  <!-- Arrows (drawn first so boxes sit on top of the lines) -->

  <!-- Client -> Posts (write) -->
  <line x1="430" y1="94" x2="230" y2="178" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="270" y="130" font-size="12.5" fill="#2563EB" text-anchor="middle">POST /posts</text>

  <!-- Client -> Comments (write) -->
  <line x1="535" y1="94" x2="735" y2="178" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="700" y="130" font-size="12.5" fill="#2563EB" text-anchor="middle">POST /posts/:id/comments</text>

  <!-- Posts -> Event Bus (event, dashed) -->
  <line x1="220" y1="244" x2="430" y2="328" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="265" y="300" font-size="12.5" fill="#B45309" text-anchor="middle">publish</text>
  <text x="265" y="316" font-size="12.5" fill="#B45309" text-anchor="middle">PostCreated</text>

  <!-- Comments -> Event Bus (event, dashed) -->
  <line x1="740" y1="244" x2="530" y2="328" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="695" y="300" font-size="12.5" fill="#B45309" text-anchor="middle">publish</text>
  <text x="695" y="316" font-size="12.5" fill="#B45309" text-anchor="middle">CommentCreated</text>

  <!-- Event Bus -> Query (broadcast, dashed) -->
  <line x1="480" y1="394" x2="480" y2="478" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="580" y="440" font-size="12.5" fill="#B45309" text-anchor="middle">forward via</text>
  <text x="580" y="456" font-size="12.5" fill="#B45309" text-anchor="middle">POST /events</text>

  <!-- Query -> Client (read), routed clear of the Comments box -->
  <path d="M 580,512 L 900,512 L 900,62 L 585,62" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="915" y="278" font-size="12.5" fill="#059669" text-anchor="start">GET /posts</text>
  <text x="915" y="296" font-size="12.5" fill="#059669" text-anchor="start">(with comments)</text>

  <!-- Client box -->
  <rect x="380" y="30" width="200" height="64" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="480" y="56" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4C1D95">Client</text>
  <text x="480" y="76" text-anchor="middle" font-size="12" fill="#5B21B6">React (CRA) · :3001</text>

  <!-- Posts box -->
  <rect x="90" y="180" width="200" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="190" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1E3A8A">Posts</text>
  <text x="190" y="226" text-anchor="middle" font-size="12" fill="#1D4ED8">Express (Node) · :3000</text>

  <!-- Comments box -->
  <rect x="670" y="180" width="200" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="770" y="206" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1E3A8A">Comments</text>
  <text x="770" y="226" text-anchor="middle" font-size="12" fill="#1D4ED8">Express (Node) · :4000</text>

  <!-- Event Bus box -->
  <rect x="380" y="330" width="200" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="480" y="356" text-anchor="middle" font-size="14.5" font-weight="600" fill="#78350F">Event Bus</text>
  <text x="480" y="376" text-anchor="middle" font-size="12" fill="#92400E">Express (Node) · :4005</text>

  <!-- Query box -->
  <rect x="380" y="480" width="200" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="506" text-anchor="middle" font-size="14.5" font-weight="600" fill="#065F46">Query</text>
  <text x="480" y="526" text-anchor="middle" font-size="12" fill="#047857">FastAPI (Python) · :4002</text>

  <!-- Legend -->
  <g transform="translate(40, 570)">
    <line x1="0" y1="4" x2="30" y2="4" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="40" y="9" font-size="12.5" fill="#374151">write (client → service)</text>

    <line x1="230" y1="4" x2="260" y2="4" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="270" y="9" font-size="12.5" fill="#374151">read (client ← query)</text>

    <line x1="440" y1="4" x2="470" y2="4" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
    <text x="480" y="9" font-size="12.5" fill="#374151">async event (fire-and-forget, via event bus)</text>
  </g>

  <text x="480" y="615" text-anchor="middle" font-size="12" fill="#6B7280">posts and comments never call each other directly — query builds the combined read-model from their events</text>
</svg>
